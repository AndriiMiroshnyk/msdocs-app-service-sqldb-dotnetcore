# Azure DevOps CI/CD - ASP.NET Core + Azure SQL

trigger: none

pr:
  branches:
    include:
      - main

pool:
  name: 'Self-hosted Agents'
  demands:
    - Agent.OS -equals Linux

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'

  azureServiceConnection: 'azure-appservice-wif'
  resourceGroupName: 'msdocs-core-sql-anmiros_group'
  webAppName: 'msdocs-core-sql-anmiros'
  slotName: 'staging'
  migrationTimeoutSeconds: '600'
  loadTestingResourceName: 'todo-load-testing'

stages:

# Stage 1: Build, Test and Publish
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildApp
    displayName: 'Build ASP.NET Core application'
    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - script: |
        dotnet restore DotNetCoreSqlDb.Tests/DotNetCoreSqlDb.Tests.csproj
      displayName: 'Restore dependencies'

    - script: |
        dotnet build DotNetCoreSqlDb.csproj \
          --configuration $(buildConfiguration) \
          --no-restore
      displayName: 'Build application'

    - script: |
        dotnet test DotNetCoreSqlDb.Tests/DotNetCoreSqlDb.Tests.csproj \
          --configuration $(buildConfiguration) \
          --no-restore \
          --results-directory "$(Agent.TempDirectory)/test-results" \
          -- \
          --report-trx \
          --report-trx-filename test-results.trx
      displayName: 'Run automated tests'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '*.trx'
        searchFolder: '$(Agent.TempDirectory)/test-results'
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true

    - script: |
        set -euo pipefail
        mkdir -p "$(Build.ArtifactStagingDirectory)/app"

        dotnet publish DotNetCoreSqlDb.csproj \
          --configuration $(buildConfiguration) \
          --no-restore \
          --output "$(Build.ArtifactStagingDirectory)/app"
      displayName: 'Publish application'

    - script: |
        set -euo pipefail
        dotnet tool install dotnet-ef \
          --tool-path "$(Agent.TempDirectory)/ef-tools" \
          --version '10.*'

        "$(Agent.TempDirectory)/ef-tools/dotnet-ef" \
          migrations bundle \
          --project DotNetCoreSqlDb.csproj \
          --startup-project DotNetCoreSqlDb.csproj \
          --configuration $(buildConfiguration) \
          --self-contained \
          --target-runtime linux-x64 \
          --output "$(Build.ArtifactStagingDirectory)/app/efbundle"
      displayName: 'Generate EF Core migrations bundle'
      env:
        ASPNETCORE_ENVIRONMENT: 'Production'

    - script: |
        set -euo pipefail
        cd "$(Build.ArtifactStagingDirectory)/app"
        test -s efbundle
        chmod +x efbundle
        mkdir -p "$(Build.ArtifactStagingDirectory)/scripts"
        cp "$(Build.SourcesDirectory)/scripts/run-migrations.sh" \
          "$(Build.ArtifactStagingDirectory)/scripts/"
      displayName: 'Prepare migrations bundle for deployment'

    - task: ArchiveFiles@2
      displayName: 'Create deployment ZIP'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish build artifacts'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'drop'
        publishLocation: 'pipeline'

# Stage 2: Deploy to Staging
- stage: DeployStaging
  displayName: 'Deploy to Staging'
  dependsOn: Build
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: DeployApp
    displayName: 'Deploy and verify staging'
    timeoutInMinutes: 30
    steps:

    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: 'Download build artifacts'
      inputs:
        buildType: 'current'
        artifactName: 'drop'
        targetPath: '$(Pipeline.Workspace)/drop'

    - task: AzureWebApp@1
      displayName: 'Deploy application to staging'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        appType: 'webAppLinux'
        appName: '$(webAppName)'
        deployToSlotOrASE: true
        resourceGroupName: '$(resourceGroupName)'
        slotName: '$(slotName)'
        package: '$(Pipeline.Workspace)/drop/app.zip'

    # Database users must be provisioned before migrations run.
    - task: AzureCLI@2
      displayName: 'Run and verify database migrations inside staging'
      timeoutInMinutes: 15
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'scriptPath'
        scriptPath: '$(Pipeline.Workspace)/drop/scripts/run-migrations.sh'
        arguments: >-
          "$(resourceGroupName)"
          "$(webAppName)"
          "$(slotName)"
          "$(Pipeline.Workspace)/drop/app/efbundle"
          "$(migrationTimeoutSeconds)"

    - bash: |
        set -euo pipefail
        response_file=$(mktemp)
        trap 'rm -f "$response_file"' EXIT

        for attempt in {1..12}; do
          status=$(curl \
            --silent \
            --show-error \
            --max-time 15 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "$(stagingUrl)") || status="000"

          echo "Attempt $attempt: HTTP $status"

          if [ "$status" = "200" ] && grep -q 'Add Todo' "$response_file"; then
            echo "Staging smoke test passed"
            exit 0
          fi

          if [ "$attempt" -lt 12 ]; then
            sleep 5
          fi
        done

        echo "Staging smoke test failed"
        exit 1
      displayName: 'Staging smoke test'

# Stage 3: Promote to Production
- stage: DeployProduction
  displayName: 'Promote to Production'
  dependsOn: DeployStaging
  condition: succeeded()
  jobs:
  - job: PromoteApp
    displayName: 'Swap slots and verify production'
    steps:

    - checkout: none

    - task: AzureAppServiceManage@0
      displayName: 'Swap staging with production'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        Action: 'Swap Slots'
        WebAppName: '$(webAppName)'
        ResourceGroupName: '$(resourceGroupName)'
        SourceSlot: '$(slotName)'
        SwapWithProduction: true

    - task: AzureCLI@2
      displayName: 'Production smoke test'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          production_hostname=$(az webapp show \
            --resource-group "$(resourceGroupName)" \
            --name "$(webAppName)" \
            --query defaultHostName --output tsv)
          test -n "$production_hostname"

          for attempt in {1..12}; do
            status=$(curl \
              --silent \
              --show-error \
              --max-time 15 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://$production_hostname/") || status="000"

            echo "Attempt $attempt: HTTP $status"

            if [ "$status" = "200" ] && grep -q 'Add Todo' "$response_file"; then
              echo "Production smoke test passed"
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done

          echo "Production smoke test failed"
          exit 1

- stage: LoadTest
  displayName: 'Load test production'
  dependsOn: DeployProduction
  condition: succeeded()
  jobs:
  - job: TestPerformance
    displayName: 'Run Todo database workload'
    timeoutInMinutes: 30
    steps:
    - checkout: self

    - task: AzureLoadTest@1
      displayName: 'Run Azure Load Testing'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        resourceGroup: '$(resourceGroupName)'
        loadTestResource: '$(loadTestingResourceName)'
        loadTestConfigFile: 'load-tests/load-test.yaml'
        loadTestRunName: 'Todo workload - $(Build.BuildNumber)'
        env: |
          [{"name":"TARGET_HOST","value":"$(loadTestHost)"}]

    - publish: '$(System.DefaultWorkingDirectory)/loadTest'
      displayName: 'Publish load test results'
      condition: succeededOrFailed()
      artifact: load-test-results
